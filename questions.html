<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Heart ❤️</title>

<style>
body{
margin:0;
background:#120318;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.card{
width:90%;
max-width:650px;
padding:30px;
}

h1{
color:#ff8fb1;
}

#progress{
color:#ffd4ea;
}

textarea{
width:90%;
height:140px;
border-radius:15px;
padding:15px;
font-size:16px;
margin-top:20px;
}

button{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff4d88;
color:white;
font-size:18px;
cursor:pointer;
}

.heart{
font-size:25px;
}
</style>

</head>

<body>

<div class="card">

<div class="heart">❤️</div>

<h1 id="progress">Question 1/10</h1>

<p id="question"></p>

<textarea id="answer" placeholder="Write your answer here..."></textarea>

<br>

<button onclick="nextQuestion()">Next ❤️</button>

</div>


<script>

const questions = [

"Whenever the thought suddenly comes into your mind, 'I have a girlfriend', what is the very first feeling that appears in your heart?",

"If someone asks you, 'Who is she?', how would you describe me beyond just my name?",

"What is one thing about me that makes you feel lucky to have me?",

"Do you feel I am still the right partner for you? Why?",

"Have you ever felt something was not right between us but didn't tell me? What was it?",

"When you imagine your future, how far do you see me with you?",

"What is one memory with me that you never want to forget?",

"What is something you think I do that makes you feel loved?",

"What is one thing you want us to improve together as a couple?",

"After everything, what do I truly mean to you?"
];

let current = 0;

function showQuestion(){

document.getElementById("progress").innerHTML =
"Question " + (current+1) + "/10 ❤️";

document.getElementById("question").innerHTML =
questions[current];

document.getElementById("answer").value="";

}


function nextQuestion(){

let answer = document.getElementById("answer").value;

if(answer.trim()==""){
alert("Please write your answer first ❤️");
return;
}

current++;

if(current < questions.length){

showQuestion();

}

else{

document.body.innerHTML = `
window.location.href = "dedication.html";

}

}

showQuestion();

</script>

</body>
</html>
